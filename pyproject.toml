# SPDX-License-Identifier: Apache-2.0
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "compilersutra-appfarm"
version = "0.1.1"
description = "Typed OSS app farm for compiler correctness and csperf-backed runtime testing"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "CompilerSutra" }]
dependencies = [
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "typer>=0.12",
  "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
# Optional: real csperf measurement. Not required to import or run csfarm.
perf = ["compilersutra-perf>=0.2.0"]

[project.scripts]
csfarm = "csfarm.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "SIM", "UP"]
ignore = [
  "B008",   # Typer Option() in defaults is idiomatic
  "E501",   # line length — prefer readability in recipes/CLI
  "S110",   # best-effort tool path probing
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
