# SPDX-License-Identifier: Apache-2.0
name: ci

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e '.[dev]'

      - name: Ruff
        run: ruff check src tests

      - name: Pytest
        run: pytest -q

      - name: CLI smoke
        run: |
          csfarm list >/dev/null
          csfarm registries >/dev/null
          csfarm plan database/sqlite@3.53 --flags baseline >/dev/null
